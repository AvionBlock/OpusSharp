stages:
  - test
  - pack
  - smoke

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key: "$CI_JOB_NAME_SLUG"
  paths:
    - .dotnet/
    - .nuget/packages/

.dotnet_9_unix:
  before_script:
    - export DOTNET_INSTALL_DIR="$CI_PROJECT_DIR/.dotnet"
    - export PATH="$DOTNET_INSTALL_DIR:$PATH"
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
    - sh dotnet-install.sh --channel 9.0 --install-dir "$DOTNET_INSTALL_DIR" --no-path
    - dotnet --info

.dotnet_9_windows:
  before_script:
    - $env:DOTNET_INSTALL_DIR = "$env:CI_PROJECT_DIR\.dotnet"
    - $env:PATH = "$env:DOTNET_INSTALL_DIR;$env:PATH"
    - Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
    - .\dotnet-install.ps1 -Channel 9.0 -InstallDir $env:DOTNET_INSTALL_DIR -NoPath
    - dotnet --info

.test_artifacts:
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - TestResults/

test:linux:
  stage: test
  tags:
    - linux
  extends:
    - .dotnet_9_unix
    - .test_artifacts
  script:
    - dotnet restore ./OpusSharp.sln
    - dotnet test ./OpusSharp.Core.Tests/OpusSharp.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

test:macos:
  stage: test
  tags:
    - macos
  extends:
    - .dotnet_9_unix
    - .test_artifacts
  script:
    - dotnet restore ./OpusSharp.sln
    - dotnet test ./OpusSharp.Core.Tests/OpusSharp.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

test:windows:
  stage: test
  tags:
    - windows
  extends:
    - .dotnet_9_windows
    - .test_artifacts
  script:
    - dotnet restore .\OpusSharp.sln
    - dotnet test .\OpusSharp.Core.Tests\OpusSharp.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory .\TestResults

pack:packages:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - docker
  script:
    - dotnet --info
    - sh ./packall.sh
  artifacts:
    expire_in: 1 week
    paths:
      - local-nuget/*.nupkg

smoke:host:linux:
  stage: smoke
  tags:
    - linux
  needs:
    - job: pack:packages
      artifacts: true
  extends:
    - .dotnet_9_unix
  script:
    - dotnet run --project ./samples/PackageSmoke/Host/OpusSharp.Smoke.Host.csproj --configuration Release

smoke:host:macos:
  stage: smoke
  tags:
    - macos
  needs:
    - job: pack:packages
      artifacts: true
  extends:
    - .dotnet_9_unix
  script:
    - dotnet run --project ./samples/PackageSmoke/Host/OpusSharp.Smoke.Host.csproj --configuration Release

smoke:host:windows:
  stage: smoke
  tags:
    - windows
  needs:
    - job: pack:packages
      artifacts: true
  extends:
    - .dotnet_9_windows
  script:
    - dotnet run --project .\samples\PackageSmoke\Host\OpusSharp.Smoke.Host.csproj --configuration Release

smoke:ios:
  stage: smoke
  tags:
    - macos
  needs:
    - job: pack:packages
      artifacts: true
  extends:
    - .dotnet_9_unix
  script:
    - dotnet workload install ios
    - dotnet build ./samples/PackageSmoke/iOS/OpusSharp.Smoke.iOS.csproj --configuration Release -f net9.0-ios -p:RuntimeIdentifier=iossimulator-arm64

smoke:browser:
  stage: smoke
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - docker
  needs:
    - job: pack:packages
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs
    - dotnet --info
    - dotnet workload install wasm-tools
  script:
    - dotnet build ./samples/PackageSmoke/Browser/OpusSharp.Smoke.Browser.csproj --configuration Release
    - cd ./samples/PackageSmoke/Browser/bin/Release/net10.0-browser
    - node --input-type=module -e "const { dotnet } = await import('./wwwroot/_framework/dotnet.js'); const { getConfig, runMain } = await dotnet.create(); const exitCode = await runMain(getConfig().mainAssemblyName, []); if (exitCode) process.exit(exitCode);"
