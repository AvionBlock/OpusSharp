stages:
  - Linux

variables:
  OPUS_REPOSITORY: https://gitlab.xiph.org/xiph/opus.git
  OPUS_VERSION: 1.6.1
  OPUS_REF: v1.6.1

Compile Linux:
  stage: Linux
  tags:
    - ubuntu
  parallel:
    matrix:
      - ARCH: x64
        CC: gcc -m64
        C_FLAGS: -m64
        CXX_FLAGS: -m64

  before_script:
    # Setup Environment.
    - apt-get update &&
      apt-get install -y cmake git automake libtool wget
    - |
      if [[ "$ARCH" == "x86" ]]; then
        apt-get install -y g++-multilib
      elif [[ "$ARCH" == "arm64" ]]; then
        apt-get install -y g++-aarch64-linux-gnu
      elif [[ "$ARCH" == "arm32" ]]; then
        apt-get install -y g++-arm-linux-gnueabi
      fi
  script:
    # Clone and setup opus.
    - git clone --branch $OPUS_REF --depth 1 $OPUS_REPOSITORY opus
    - ./opus/autogen.sh
    - mkdir build
  
    # Configure.
    - cmake -S ./opus -B ./build 
      -DCMAKE_BUILD_TYPE=Release 
      -DBUILD_SHARED_LIBS=OFF 
      -DOPUS_BUILD_PROGRAMS=ON 
      -DCMAKE_POSITION_INDEPENDENT_CODE=ON 
      -DCMAKE_C_FLAGS=$C_FLAGS 
      -DCMAKE_CXX_FLAGS=$CXX_FLAGS
    
    # Build
    - cmake --build ./build
  
    # Shim Link.
    - $CC -shared -o ./build/opus.so -I ./opus/include ./OpusSharp.Natives/opus_shim.c -Wl,--whole-archive ./build/libopus.a -Wl,--no-whole-archive -lm