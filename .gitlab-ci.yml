stages:
  - Linux

variables:
  OPUS_REPOSITORY: https://gitlab.xiph.org/xiph/opus.git
  OPUS_VERSION: 1.6.1
  OPUS_REF: v1.6.1

Compile Linux:
  stage: Linux
  tags:
    - ubuntu
  parallel:
    matrix:
      - ARCH: x64
        CC: gcc -m64
        C_FLAGS: -m64
        CXX_FLAGS: -m64
      - ARCH: x86
        CC: gcc -m32
        C_FLAGS: -m32
        CXX_FLAGS: -m32
      - ARCH: arm64
        CC: aarch64-linux-gnu-gcc
        C_COMPILER: aarch64-linux-gnu-gcc
        CXX_COMPILER: aarch64-linux-gnu-g++
      - ARCH: arm32
        CC: arm-linux-gnueabi-gcc
        C_COMPILER: arm-linux-gnueabi-gcc
        CXX_COMPILER: arm-linux-gnueabi-g++
          
  script:
    # Setup Environment
    - apt-get update
    - apt-get install -y git
    - |
      if [[ "$ARCH" == "x86" ]]; then
        apt-get install -y g++-multilib
      elif [[ "$ARCH" == "arm64" ]]; then
        apt-get install -y g++-aarch64-linux-gnu
      elif [[ "$ARCH" == "arm32" ]]; then
        apt-get install -y g++-arm-linux-gnueabi
      fi
    
    - mkdir build
    - git clone --branch $OPUS_REF --depth 1 $OPUS_REPOSITORY opus
    - ./opus/autogen.sh
    - cd ./build
    - cmake --build . -j 2 --config Release
    - |
      $CC -shared -o \
      -I../opus/include \
      ../OpusSharp.Native/opus_shim.c \
      -Wl,--whole-archive libopus.a -Wl,--no-whole-archive \
      -lm